name: CMB Final Region Flow Build

on:
  pull_request:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/CadExcelConverter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps ezdxf==1.0.3 pyproj==3.7.2
          python -m pip install -r requirements.txt
      - name: Compile canonical region modules
        shell: pwsh
        run: |
          python -m py_compile admin_upload.py online_viewer.py server_client_windows.py backup_v2.py recovery_v2.py
      - name: Run checks
        shell: pwsh
        run: python run_checks.py
      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name CMB_DXF_Viewer_v3.36 --collect-all pyproj --collect-all ezdxf --exclude-module numpy --exclude-module fontTools main.py
      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\CMB_DXF_Viewer_v3.36.exe release\CMB_DXF_Viewer_v3.36.exe
          Set-Content -Path release\BUILD_INFO.txt -Encoding UTF8 -Value @(
            "CMB DXF Viewer v3.36 FINAL REGION FLOW",
            "Commit: $env:GITHUB_SHA",
            "Region key: server regions.id only",
            "Online: /regions -> /online/{region}/layers -> /online/{region}/objects",
            "Internal TLS: fixed 192.168.246.54 only"
          )
          Compress-Archive -Path release\* -DestinationPath CMB_DXF_Viewer_v3.36_FINAL_REGION_FLOW_20261011.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: CMB_DXF_Viewer_v3.36_FINAL_REGION_FLOW_20261011
          path: desktop/CadExcelConverter/CMB_DXF_Viewer_v3.36_FINAL_REGION_FLOW_20261011.zip
          if-no-files-found: error
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cad-network-release.jks"
          chmod 600 "$RUNNER_TEMP/cad-network-release.jks"
      - name: Build and test signed APK
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/cad-network-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle clean :app:testDebugUnitTest :app:assembleRelease
      - name: Verify APK signature
        run: keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk
      - name: Package Android
        run: cp app/build/outputs/apk/release/app-release.apk CMB_CAD_Network_FINAL_REGION_FLOW_20261011.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CMB_CAD_Network_FINAL_REGION_FLOW_20261011
          path: CMB_CAD_Network_FINAL_REGION_FLOW_20261011.apk
          if-no-files-found: error
          retention-days: 7
