name: CMB Windows Latest Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/CadExcelConverter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps ezdxf==1.0.3 pyproj==3.7.2
          python -m pip install -r requirements.txt

      - name: Run checks
        shell: pwsh
        run: python run_checks.py

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name CMB_DXF_Viewer_v3.36 --collect-all pyproj --collect-all ezdxf --exclude-module numpy --exclude-module fontTools main.py

      - name: Package ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\CMB_DXF_Viewer_v3.36.exe release\CMB_DXF_Viewer_v3.36.exe
          Set-Content -Path release\BUILD_INFO.txt -Encoding UTF8 -Value @(
            "CMB DXF Viewer v3.36",
            "Commit: $env:GITHUB_SHA",
            "Built: $(Get-Date -Format s)",
            "Includes: backup memo, backup restore, backup retention setting, UUID revision restore fix"
          )
          Compress-Archive -Path release\* -DestinationPath CMB_DXF_Viewer_v3.36_LATEST_UUID_BACKUP_20261011.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CMB_DXF_Viewer_v3.36_LATEST_UUID_BACKUP_20261011
          path: desktop/CadExcelConverter/CMB_DXF_Viewer_v3.36_LATEST_UUID_BACKUP_20261011.zip
          if-no-files-found: error
          retention-days: 7
