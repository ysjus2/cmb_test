name: CMB Windows Network Backup V2 Build

on:
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/CadExcelConverter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps ezdxf==1.0.3 pyproj==3.7.2
          python -m pip install -r requirements.txt
      - name: Syntax check new backup modules
        shell: pwsh
        run: |
          python -m py_compile backup_v2.py recovery_v2.py admin_upload.py server_extract.py server_client_windows.py
      - name: Run checks
        shell: pwsh
        run: python run_checks.py
      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name CMB_DXF_Viewer_v3.36 --collect-all pyproj --collect-all ezdxf --exclude-module numpy --exclude-module fontTools main.py
      - name: Package ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\CMB_DXF_Viewer_v3.36.exe release\CMB_DXF_Viewer_v3.36.exe
          Set-Content -Path release\BUILD_INFO.txt -Encoding UTF8 -Value @(
            "CMB DXF Viewer v3.36 - Network Backup V2",
            "Commit: $env:GITHUB_SHA",
            "Includes: device symbols, rotation/scale, cable color/lineweight, XDATA link remapping, UUID restore, backup retention, TLS fix"
          )
          Compress-Archive -Path release\* -DestinationPath CMB_DXF_Viewer_v3.36_NETWORK_BACKUP_V2_20261011.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CMB_DXF_Viewer_v3.36_NETWORK_BACKUP_V2_20261011
          path: desktop/CadExcelConverter/CMB_DXF_Viewer_v3.36_NETWORK_BACKUP_V2_20261011.zip
          if-no-files-found: error
          retention-days: 7
