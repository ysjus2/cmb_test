name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: gradle :app:assembleDebug

      - name: Export public certificate hash for Kakao
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk -rfc \
            | openssl x509 -outform DER \
            | openssl sha1 -binary | openssl base64 > kakao-key-hash.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CAD-Network-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            kakao-key-hash.txt
          if-no-files-found: error
