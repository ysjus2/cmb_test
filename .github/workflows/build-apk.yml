name: Build Signed APK v2.23_FINAL

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'kakao.properties.example'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore fixed signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cad-network-release.jks"
          chmod 600 "$RUNNER_TEMP/cad-network-release.jks"

      - name: Build signed release APK
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/cad-network-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle clean :app:testDebugUnitTest :app:assembleRelease

      - name: Verify APK signature
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk
          keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk -rfc \
            | openssl x509 -outform DER \
            | openssl sha1 -binary | openssl base64 > kakao-key-hash.txt
          cp app/build/outputs/apk/release/app-release.apk CMB_Android_v2.23_FINAL.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CMB-Android-v2.23-FINAL
          path: |
            CMB_Android_v2.23_FINAL.apk
            kakao-key-hash.txt
          if-no-files-found: error

      - name: Publish direct-download Android Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.23_FINAL
          name: CMB Android v2.23 FINAL
          body: |
            Mobile viewer synced to current Windows online-view policy:
            - manual authorized-region selection; map movement never changes the selected region
            - full regional FIBER cache first; movement refresh excludes FIBER and loads nearby non-fiber data
            - optical closure visible from L3; all other optical devices visible from L2
            - existing COAX level policy remains unchanged
            - minimal POLE metadata supported; pole detail shows pole number only
            - stale cache remains visible until successful refresh
            - hybrid Kakao map and distance measurement retained
          target_commitish: ${{ github.sha }}
          files: CMB_Android_v2.23_FINAL.apk
          make_latest: false
