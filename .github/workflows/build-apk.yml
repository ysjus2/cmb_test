name: Build Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore fixed signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cad-network-release.jks"
          chmod 600 "$RUNNER_TEMP/cad-network-release.jks"

      - name: Build signed release APK
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/cad-network-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle clean :app:testDebugUnitTest :app:assembleRelease

      - name: Verify APK signature
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk
          keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk -rfc \
            | openssl x509 -outform DER \
            | openssl sha1 -binary | openssl base64 > kakao-key-hash.txt

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CAD-Network-signed-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            kakao-key-hash.txt
          if-no-files-found: error
