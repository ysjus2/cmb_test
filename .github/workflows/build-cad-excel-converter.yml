name: Build current CMB DXF Viewer v3.58_FINAL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/CadExcelConverter/**'
      - '.github/workflows/build-cad-excel-converter.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/CadExcelConverter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/CadExcelConverter/requirements.txt
      - name: Install current dependency set
        shell: powershell
        run: |
          python -m pip install --no-deps ezdxf==1.0.3 pyproj==3.7.2
          python -m pip install -r requirements.txt
      - name: Current regression suite
        run: python run_checks.py
      - name: Build current source directly
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name CMB_DXF_Viewer_v3.58_FINAL --collect-all pyproj --collect-all ezdxf --collect-all webview `
            --add-data "cmb_dev_ca.crt;." `
            --exclude-module numpy --exclude-module fontTools main.py
          Get-FileHash dist/CMB_DXF_Viewer_v3.58_FINAL.exe -Algorithm SHA256
      - name: Upload current build
        uses: actions/upload-artifact@v4
        with:
          name: CMB-DXF-Viewer-current-v3.58_FINAL
          path: desktop/CadExcelConverter/dist/CMB_DXF_Viewer_v3.58_FINAL.exe
          if-no-files-found: error
          retention-days: 7

      - name: Package direct download ZIP
        shell: powershell
        run: |
          Compress-Archive -Path dist/CMB_DXF_Viewer_v3.58_FINAL.exe -DestinationPath dist/CMB_DXF_Viewer_v3.58_FINAL.zip -Force

      - name: Publish direct-download GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.58_FINAL
          name: CMB DXF Viewer v3.58 FINAL
          body: Windows online viewer final build. Includes fiber/coax/conduit/pole display and device Point upload fixes.
          files: desktop/CadExcelConverter/dist/CMB_DXF_Viewer_v3.58_FINAL.zip
          make_latest: true
