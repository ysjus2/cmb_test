name: Build CMB DXF Viewer Windows 1.0 Rev23
run-name: Rev23 Windows build - ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop/CadExcelConverter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/CadExcelConverter/requirements.txt
      - name: Install current dependency set
        shell: powershell
        run: |
          python -m pip install --no-deps ezdxf==1.0.3 pyproj==3.7.2
          python -m pip install -r requirements.txt
      - name: Current regression suite
        run: python run_checks.py
      - name: Build current source directly
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name CMB_DXF_Viewer_Windows_1.0_Rev23 --collect-all pyproj --collect-all ezdxf --collect-all webview `
            --add-data "cmb_dev_ca.crt;." `
            --exclude-module numpy --exclude-module fontTools main.py
          Get-FileHash dist/CMB_DXF_Viewer_Windows_1.0_Rev23.exe -Algorithm SHA256
      - name: Verify packaged executable
        shell: powershell
        run: |
          $process = Start-Process -FilePath dist/CMB_DXF_Viewer_Windows_1.0_Rev23.exe -ArgumentList '--build-smoke-test', 'dist/build-smoke.json' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(120000)) { Stop-Process -Id $process.Id; throw "Packaged smoke test timed out" }
          if ($process.ExitCode -ne 0) { throw "Packaged executable smoke test failed" }
          python verify_release.py dist/CMB_DXF_Viewer_Windows_1.0_Rev23.exe dist/build-smoke.json dist/BUILD_MANIFEST.json
      - name: Upload current build
        uses: actions/upload-artifact@v4
        with:
          name: CMB-DXF-Viewer-Windows-1.0-Rev23
          path: |
            desktop/CadExcelConverter/dist/CMB_DXF_Viewer_Windows_1.0_Rev23.exe
            desktop/CadExcelConverter/dist/BUILD_MANIFEST.json
          if-no-files-found: error
          retention-days: 7

      - name: Package direct download ZIP
        shell: powershell
        run: |
          Compress-Archive -Path dist/CMB_DXF_Viewer_Windows_1.0_Rev23.exe, dist/BUILD_MANIFEST.json -DestinationPath dist/CMB_DXF_Viewer_Windows_1.0_Rev23.zip -Force

      - name: Publish direct-download GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v1.0-rev23
          name: CMB DXF Viewer Windows 1.0 Rev23
          body: |
            Windows 1.0 Rev23 canonical shared-endpoint coordinate Excel export and concise CAD object IDs, 5m endpoint join, expired-session reset: simplified role-based toolbar, multi-route fiber cable selection with start/end modes, endpoint toggle cancel, one-step undo, overlap rejection, CAD-only conduit diameter policy, upload-only server UI, and USER MEMO point-only upload.
          target_commitish: ${{ github.sha }}
          files: desktop/CadExcelConverter/dist/CMB_DXF_Viewer_Windows_1.0_Rev23.zip
          make_latest: true

