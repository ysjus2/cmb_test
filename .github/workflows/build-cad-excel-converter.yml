name: Build CMB Network PC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/CadExcelConverter/**'
      - '.github/workflows/build-cad-excel-converter.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/CadExcelConverter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: desktop/CadExcelConverter/requirements.txt

      - name: Install clean dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps pyproj==3.7.2
          $installed = pip list --format=json | ConvertFrom-Json
          $blocked = @("numpy", "fonttools", "certifi")
          foreach ($name in $blocked) {
            if ($installed.name -contains $name) { throw "$name must not be installed in the v3.20-clean build" }
          }
          python -c "import ezdxf, openpyxl, pyproj, pyparsing, typing_extensions; print('ezdxf', ezdxf.__version__); print('openpyxl', openpyxl.__version__); print('pyproj', pyproj.__version__)"

      - name: Apply UI policy
        run: python apply_ui_policy.py
      - name: Apply direct ESSENPOLY Excel fix
        run: python apply_excel_cable_fix.py
      - name: Apply viewer-first shell
        run: python apply_viewer_shell.py
      - name: Apply interaction policy
        run: python apply_interaction_policy.py
      - name: Apply Escape policy
        run: python apply_escape_policy.py
      - name: Apply v3.14 layout
        run: python apply_layout_v314.py
      - name: Apply v3.15 layout
        run: python apply_layout_v315.py
      - name: Apply v3.16 layout
        run: python apply_layout_v316.py
      - name: Apply v3.17 layout
        run: python apply_layout_v317.py
      - name: Apply v3.18 layout
        run: python apply_layout_v318.py
      - name: Apply v3.19 layout
        run: python apply_layout_v319.py

      - name: Verify no DWG copyleft engine
        shell: powershell
        run: |
          if (Select-String -Path "*.py" -Pattern "LibreDWG|ODAFileConverter|dwgread.exe|dwg2dxf.exe" -Quiet) {
            throw "DWG/LibreDWG/ODA reference detected in company DXF-only build"
          }

      - name: Audit runtime package licenses
        run: python license_audit.py
      - name: Test ESSENPOLY recovery
        run: python essenpoly_selftest.py
      - name: Run core self-test
        run: python selftest.py
      - name: Run functional regression
        run: python functional_regression.py

      - name: Build Windows app using system runtime policy
        shell: powershell
        run: pyinstaller --noconfirm --clean CMB_DXF_Viewer.spec

      - name: Inspect final app dependency contents
        shell: powershell
        run: |
          pyi-archive_viewer -r -b "dist\CMB_Network.exe" | Out-File -Encoding utf8 exe-contents.txt
          $badOpen = Select-String -Path exe-contents.txt -Pattern "(^|[\\/])numpy([\\/]|\.|$)|fontTools|fonttools|openblas|libscipy_openblas" -CaseSensitive:$false
          if ($badOpen) { $badOpen | ForEach-Object { Write-Host $_.Line }; throw "Blocked NumPy/fontTools/OpenBLAS content found" }
          $badMsRuntime = Select-String -Path exe-contents.txt -Pattern "^(?!.*pyproj\.libs[\\/]).*(^|[\\/])(ucrtbase\.dll|api-ms-win-[^\\/]*\.dll|vcruntime140[^\\/]*\.dll|msvcp140[^\\/]*\.dll)$" -CaseSensitive:$false
          if ($badMsRuntime) { $badMsRuntime | ForEach-Object { Write-Host $_.Line }; throw "Bundled top-level Microsoft system/VC runtime DLL found" }
          Write-Host "PASS: top-level Windows UCRT/API-set/VC runtime DLLs are excluded; pyproj.libs hashed dependencies are allowed"

      - name: Launch app smoke test
        shell: powershell
        run: |
          $proc = Start-Process -FilePath "dist\CMB_Network.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) { throw "CMB_Network.exe exited during smoke test. ExitCode=$($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force
          Write-Host "PASS: app launched and remained alive for 8 seconds"

      - name: Launch local DXF mode smoke test
        shell: powershell
        run: |
          $proc = Start-Process -FilePath "dist\CMB_Network.exe" -ArgumentList '--local-dxf' -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) { throw "Local DXF mode exited during smoke test. ExitCode=$($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force
          Write-Host "PASS: local DXF mode launched and remained alive for 8 seconds"

      - name: Prepare exact license notice for installer
        shell: powershell
        run: |
          $exeHash = (Get-FileHash "dist\CMB_Network.exe" -Algorithm SHA256).Hash
          $notice = Get-Content "THIRD_PARTY_LICENSES.txt" -Raw
          $identity = "`r`n`r`nFINAL BUILD IDENTITY`r`n====================`r`nGit commit: $env:GITHUB_SHA`r`nGitHub Actions run: $env:GITHUB_RUN_ID`r`nApp EXE SHA-256: $exeHash`r`nRuntime policy: Windows 10/11 UCRT/API-set DLLs use OS copies; VC++ v14 x64 Runtime is checked by Setup and installed from Microsoft's official Redistributable when missing.`r`n"
          Set-Content -Path "THIRD_PARTY_LICENSES_BUILD.txt" -Value ($notice + $identity) -Encoding UTF8
          Copy-Item "THIRD_PARTY_LICENSES_BUILD.txt" "THIRD_PARTY_LICENSES.txt" -Force

      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y --no-progress

      - name: Build single installer EXE
        shell: powershell
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" /INPUTCHARSET UTF8 "CMB_DXF_Viewer_Setup.nsi"
          if (-not (Test-Path "CMB_Network_Setup.exe")) { throw "Setup EXE was not created" }
          Get-FileHash "CMB_Network_Setup.exe" -Algorithm SHA256 | Format-List

      - name: Validate installer registration and shortcuts
        shell: powershell
        run: |
          $p = Start-Process -FilePath ".\CMB_Network_Setup.exe" -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent installer failed: $($p.ExitCode)" }
          $installDir = "$env:ProgramFiles\CMB_Network"
          if (-not (Test-Path "$installDir\CMB_Network.exe")) { throw "Installed EXE missing" }
          if (-not (Test-Path "$installDir\Uninstall.exe")) { throw "Uninstall.exe missing" }
          if (-not (Test-Path "$installDir\THIRD_PARTY_LICENSES.txt")) { throw "License notice missing" }
          if (-not (Test-Path "$installDir\cmb_dev_ca.crt")) { throw "CMB CA certificate missing" }
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("$installDir\cmb_dev_ca.crt")
          $root = Get-ChildItem Cert:\LocalMachine\Root | Where-Object Thumbprint -eq $cert.Thumbprint
          if (-not $root) { throw "CMB Development CA was not installed in LocalMachine Root" }
          if (-not (Test-Path "$env:PUBLIC\Desktop\CMB Network PC.lnk") -and -not (Test-Path "$env:USERPROFILE\Desktop\CMB Network PC.lnk")) { throw "Desktop shortcut missing" }
          $startMenu = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\CMB Network PC\CMB Network PC.lnk'
          if (-not (Test-Path $startMenu)) { throw "Start menu shortcut missing" }
          $uninstallKey = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\CMB_Network'
          if (-not (Test-Path $uninstallKey)) { throw "Windows uninstall registration missing" }
          $u = Get-ItemProperty $uninstallKey
          if ($u.DisplayName -ne 'CMB Network PC') { throw "Unexpected uninstall DisplayName" }
          Write-Host "PASS: installer, shortcuts and Windows uninstall registration verified"

      - name: Uninstall validation install
        shell: powershell
        run: |
          $uninstaller = "$env:ProgramFiles\CMB_Network\Uninstall.exe"
          if (Test-Path $uninstaller) { Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CMB-Network-PC-Setup-Windows-x64
          path: desktop/CadExcelConverter/CMB_Network_Setup.exe
          if-no-files-found: error
