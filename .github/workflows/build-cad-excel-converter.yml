name: Build current CMB DXF Viewer Windows 1.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/CadExcelConverter/**'
      - '.github/workflows/build-cad-excel-converter.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop/CadExcelConverter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/CadExcelConverter/requirements.txt
      - name: Install current dependency set
        shell: powershell
        run: |
          python -m pip install --no-deps ezdxf==1.0.3 pyproj==3.7.2
          python -m pip install -r requirements.txt
      - name: Current regression suite
        run: python run_checks.py
      - name: Build current source directly
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name CMB_DXF_Viewer_Windows_1.0 --collect-all pyproj --collect-all ezdxf --collect-all webview `
            --add-data "cmb_dev_ca.crt;." `
            --exclude-module numpy --exclude-module fontTools main.py
          Get-FileHash dist/CMB_DXF_Viewer_Windows_1.0.exe -Algorithm SHA256
      - name: Verify packaged executable
        shell: powershell
        run: |
          $process = Start-Process -FilePath dist/CMB_DXF_Viewer_Windows_1.0.exe -ArgumentList '--build-smoke-test', 'dist/build-smoke.json' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(120000)) { Stop-Process -Id $process.Id; throw "Packaged smoke test timed out" }
          if ($process.ExitCode -ne 0) { throw "Packaged executable smoke test failed" }
          python verify_release.py dist/CMB_DXF_Viewer_Windows_1.0.exe dist/build-smoke.json dist/BUILD_MANIFEST.json
      - name: Upload current build
        uses: actions/upload-artifact@v4
        with:
          name: CMB-DXF-Viewer-Windows-1.0
          path: |
            desktop/CadExcelConverter/dist/CMB_DXF_Viewer_Windows_1.0.exe
            desktop/CadExcelConverter/dist/BUILD_MANIFEST.json
          if-no-files-found: error
          retention-days: 7

      - name: Package direct download ZIP
        shell: powershell
        run: |
          Compress-Archive -Path dist/CMB_DXF_Viewer_Windows_1.0.exe, dist/BUILD_MANIFEST.json -DestinationPath dist/CMB_DXF_Viewer_Windows_1.0.zip -Force

      - name: Publish direct-download GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v1.0
          name: CMB DXF Viewer Windows 1.0
          body: |
            Windows 1.0: final Windows baseline including current online viewer, fiber symbols, mobile-parity source rules, and OFD/FDF/L2/L3/RN refinements.
          target_commitish: ${{ github.sha }}
          files: desktop/CadExcelConverter/dist/CMB_DXF_Viewer_Windows_1.0.zip
          make_latest: true

