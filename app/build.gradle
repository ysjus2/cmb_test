plugins {
    id 'com.android.application'
}

def kakaoProperties = new Properties()
def kakaoPropertiesFile = rootProject.file('kakao.properties')
if (kakaoPropertiesFile.exists()) {
    kakaoPropertiesFile.withInputStream { kakaoProperties.load(it) }
}
def kakaoKey = System.getenv('KAKAO_NATIVE_APP_KEY') ?: kakaoProperties.getProperty('KAKAO_NATIVE_APP_KEY', '')
if (kakaoKey && !(kakaoKey ==~ /[a-fA-F0-9]{32}/)) {
    throw new GradleException('KAKAO_NATIVE_APP_KEY must be a 32-character native app key.')
}

def signingStoreFile = System.getenv('ANDROID_KEYSTORE_FILE')
def signingStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def signingKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def signingKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def fixedSigningReady = signingStoreFile && signingStorePassword && signingKeyAlias && signingKeyPassword

android {
    namespace 'com.example.celldb'
    compileSdk 35

    defaultConfig {
        applicationId "com.ysjus2.cadnetwork"
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName "2.2"
        buildConfigField 'String', 'KAKAO_NATIVE_APP_KEY', '"' + kakaoKey + '"'
    }

    signingConfigs {
        fixedRelease {
            if (fixedSigningReady) {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (fixedSigningReady) {
                signingConfig signingConfigs.fixedRelease
            }
        }
    }

    buildFeatures { buildConfig true }
}

tasks.whenTaskAdded { task ->
    if (task.name.toLowerCase().contains('release') && !fixedSigningReady) {
        task.doFirst {
            throw new GradleException('Fixed Android signing secrets are missing. Configure ANDROID_KEYSTORE_* values.')
        }
    }
}

dependencies {
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation 'com.kakao.maps.open:android:2.15.2'
}
